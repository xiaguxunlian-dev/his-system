name: Build & Publish Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: his-jars
          path: |
            his-*/target/*.jar
            !his-*/target/*-SNAPSHOT.jar
          retention-days: 7

  publish-package:
    name: Publish Maven Package
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish his-common to GitHub Packages
        run: |
          cd his-common
          mvn deploy -DskipTests --batch-mode \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/xiaguxunlian-dev/his-system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
