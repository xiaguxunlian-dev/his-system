# ==========================================
# 医院信息系统 (HIS) 配置文件
# ==========================================
# 切换数据库：修改 db.type=postgresql 即可切换到生产数据库
# 也可通过环境变量覆盖：
#   HIS_DB_TYPE=postgresql
#   HIS_DB_HOST=localhost
#   HIS_DB_PORT=5432
#   HIS_DB_NAME=his_db
#   HIS_DB_USER=his_user
#   HIS_DB_PASS=your_password
# ==========================================

# 数据库类型: h2 (开发测试) | postgresql (生产)
db.type=h2

# PostgreSQL 连接配置 (db.type=postgresql 时生效)
db.host=localhost
db.port=5432
db.name=his_db
db.username=his_user
db.password=his@2026

# H2 内存数据库配置 (db.type=h2 时生效，仅开发测试用，重启数据丢失)
db.h2.name=his_db

# 连接池配置
db.pool.size=20
db.pool.min.idle=5
db.pool.timeout=30000
db.pool.idle.timeout=600000
db.pool.max.lifetime=1800000
db.pool.keepalive.time=60000

# 应用配置
app.name=医院信息管理系统
app.version=1.0.0
app.locale=zh_CN

# 医院基本信息
hospital.name=XX医院
hospital.address=
hospital.phone=

# 日志配置
log.level=INFO
log.file=logs/his.log
